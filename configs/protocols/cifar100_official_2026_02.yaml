name: cifar100_official_2026_02
dataset: cifar100
epochs: 200
batch_size: 128
num_workers: 4
seed: 42
deterministic: true
optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.1
scheduler:
  name: cosine_annealing
  eta_min: 0.0
transforms:
  train: [random_crop, horizontal_flip, autoaugment_cifar10, to_tensor, normalize, random_erasing]
  evaluation: [to_tensor, normalize]
  crop_padding: 4
  random_erasing_probability: 0.25
normalization:
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
evaluation:
  split: test
  metric: top1_accuracy
  checkpoint: best
