[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cliffordnet-cl20"
version = "0.1.0"
description = "Reproducible Cl(2,0) extensions to CliffordNet"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mpmath==1.3.0",
  "numpy==2.2.6",
  "sympy==1.14.0",
  "timm==1.0.22",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "tqdm==4.67.1",
  "wandb==0.25.1",
]

[project.optional-dependencies]
acceleration = ["triton==3.6.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cliffordnet_cl20"]
